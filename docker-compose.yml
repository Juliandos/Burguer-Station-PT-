services:
  app:
    build: .
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - DATABASE_URL=mysql://root:password@db:3306/burger_station
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: burger_station
      MYSQL_USER: burger_user
      MYSQL_PASSWORD: burger_password
      MYSQL_INITDB_SKIP_TZINFO: 1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./script-bd.sql:/docker-entrypoint-initdb.d/01-script-bd.sql
      - ./init-db.sh:/docker-entrypoint-initdb.d/02-init-db.sh
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      timeout: 30s
      retries: 15
      interval: 10s
      start_period: 30s

volumes:
  mysql_data:
